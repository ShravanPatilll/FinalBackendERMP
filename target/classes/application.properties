spring.application.name=erp-backend

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/erp_reimbursement?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:261202}

# Non-destructive schema update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# JWT - 24 minutes
app.jwt.secret=${APP_JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_BYTES}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:1440000}

app.upload-dir=${APP_UPLOAD_DIR:./uploads}

app.cors-origins=${APP_CORS_ORIGINS:http://localhost:4200}

# Bill OCR
app.bill-ocr.enabled=true
app.bill-ocr.api-key=K81018496888957
app.bill-ocr.api-url=https://api.ocr.space/parse/image
